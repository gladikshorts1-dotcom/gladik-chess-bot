<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>Gladik Chess</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#fff;font:15px system-ui}main{width:min(100%,520px);margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:22px;font-weight:800}.sub{color:#94a3b8;font-size:12px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}.menu button{border:1px solid #334155;background:#172337;color:#fff;border-radius:14px;padding:14px 8px;font-size:14px;font-weight:600}.menu button:first-child{background:#d39b55;color:#16120e}.card{background:#111c2e;border:1px solid #263650;border-radius:18px;padding:14px}.board{width:100%;max-width:460px;margin:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));overflow:hidden;border-radius:14px;border:3px solid #1e293b}.sq{appearance:none;border:0;width:100%;aspect-ratio:1;display:grid;place-items:center;padding:0;font-size:clamp(24px,10vw,48px);line-height:1;cursor:pointer}.light{background:#e5c18a}.dark{background:#7b4b29}.selected{outline:4px solid #38bdf8;outline-offset:-4px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:0;border-radius:12px;padding:12px;background:#24324a;color:#fff}.title{font-size:17px;font-weight:700;margin:4px 0 12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #263650}</style></head><body><main><div class="top"><div><div class="brand">♟ Gladik Chess</div><div class="sub">Telegram Mini App</div></div><div>♟️</div></div><div class="menu"><button onclick="start()">♟ O‘ynash</button><button onclick="leader()">🏆 Reyting</button><button onclick="profile()">👤 Profil</button><button onclick="stats()">📊 Statistika</button></div><div id="out" class="card"><div class="title">Shaxmatni boshlang</div><div class="sub">O‘ynash tugmasini bosing.</div></div></main><script>const tg=window.Telegram?.WebApp;tg?.ready();let gameId,fen,selected;const P={r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔',P:'♙'};async function start(){const r=await fetch('/api/game/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:tg?.initDataUnsafe?.user?.id||0})});const x=await r.json();gameId=x.id;fen=x.fen;draw()}function draw(){const box=document.createElement('div');box.className='card';box.innerHTML='<div class="title">O‘yin • Oq yuradi</div>';const board=document.createElement('div');board.className='board';fen.split('/').forEach((row,y)=>{let x=0;for(const c of row){if(/[1-8]/.test(c)){x+=Number(c);continue}const s=document.createElement('button');s.className='sq '+((x+y)%2?'dark':'light');s.textContent=P[c]||'';s.onclick=()=>pick('abcdefgh'[x]+(8-y),s);board.append(s);x++}});box.append(board);const a=document.createElement('div');a.className='actions';a.innerHTML='<button onclick="start()">🔄 Yangi o‘yin</button><button onclick="home()">🏠 Menyu</button>';box.append(a);out.replaceChildren(box)}function pick(square,el){if(!selected){selected=square;el.classList.add('selected');return}fetch('/api/game/move',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({gameId,from:selected,to:square})}).then(r=>r.json()).then(x=>{if(!x.fen){alert(x.error||'Noqonuniy yurish');selected=null;draw();return}fen=x.fen;selected=null;draw()})}function home(){out.innerHTML='<div class="title">Shaxmatni boshlang</div><div class="sub">O‘ynash tugmasini bosing.</div>'}async function leader(){const a=await(await fetch('/api/leaderboard')).json();out.innerHTML='<div class="title">🏆 TOP 100</div>'+a.map((x,i)=>'<div class="row"><span>'+(i+1)+'. @'+(x.username||x.first_name)+'</span><b>'+x.rating+'</b></div>').join('')}async function stats(){const x=await(await fetch('/api/stats')).json();out.innerHTML='<div class="title">📊 Statistika</div><div class="row"><span>Jami ro‘yxatdan o‘tganlar</span><b>'+x.total+'</b></div>'}async function profile(){out.innerHTML='<div class="title">👤 Profil</div><div class="sub">Telegram profilingiz bilan ulangan.</div>'}</script></body></html>
