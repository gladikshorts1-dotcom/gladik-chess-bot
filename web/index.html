<!doctype html><html lang="uz"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>Gladik Chess</title><style>body{margin:0;background:#111827;color:#fff;font:16px system-ui}main{max-width:520px;margin:auto;padding:18px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:14px;border:0;border-radius:12px;background:#374151;color:#fff;font-size:15px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1}.sq{display:grid;place-items:center;font-size:clamp(24px,9vw,48px)}.l{background:#d9b88c}.d{background:#7b4f2c}</style><main><h2>♟ Gladik Chess</h2><div class="menu"><button onclick="start()">♟ O‘ynash</button><button onclick="lead()">🏆 Reyting</button><button onclick="profile()">👤 Profil</button><button onclick="stats()">📊 Statistika</button></div><section id="out">O‘ynash tugmasini bosing.</section></main><script>const tg=Telegram.WebApp;tg.ready();let id,fen,sel;const P={r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔',P:'♙'};async function start(){let r=await fetch('/api/game/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:tg.initDataUnsafe.user?.id||0})});let x=await r.json();id=x.id;fen=x.fen;draw()}function draw(){let b=document.createElement('div');b.className='board';fen.split('/').forEach((row,y)=>{let x=0;for(let c of row){if(/\d/.test(c)){x+=+c;continue}let s=document.createElement('button');s.className='sq '+((x+y)%2?'d':'l');s.textContent=P[c];s.onclick=()=>move(y,x);b.append(s);x++}});out.innerHTML='';out.append(b)}function move(y,x){let q='abcdefgh'[x]+(8-y);if(!sel){sel=q;return}fetch('/api/game/move',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({gameId:id,from:sel,to:q})}).then(r=>r.json()).then(x=>{if(x.fen){fen=x.fen;sel=null;draw()}else alert('Noqonuniy yurish')})}async function lead(){out.innerHTML=(await(await fetch('/api/leaderboard')).json()).map((x,i)=>i+1+'. @'+(x.username||x.first_name)+' — '+x.rating).join('<br>')}async function stats(){let x=await(await fetch('/api/stats')).json();out.innerHTML='JAMI RO‘YXATDAN O‘TGANLAR: '+x.total+'<br>BUGUN: '+x.today}async function profile(){let x=await(await fetch('/api/user?id='+(tg.initDataUnsafe.user?.id||0))).json();out.innerHTML=x?x.first_name+'<br>🏆 '+x.rating+' ELO<br>✅ '+x.wins+' &nbsp; ❌ '+x.losses+' &nbsp; 🤝 '+x.draws:'Avval botda ro‘yxatdan o‘ting.'}</script>
